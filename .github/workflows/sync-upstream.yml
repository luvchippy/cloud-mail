name: Sync Upstream

on:
  schedule:
    # 每天北京时间早上 08:00 (UTC 00:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 Actions 页面手动点击按钮立即触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork with Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main --source maillab/cloud-mail --force
